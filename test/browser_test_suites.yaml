# Standalone Dart tests run in Chrome with both dart2js and dart2wasm.
dart:
  - test/lib/engine_api/length_prefixed_json_decoder_test.dart
  - test/lib/engine_api/visualization_record_test.dart
  - test/lib/engine_api/wasm_visualization_record_ring_buffer_test.dart
  - test/lib/helpers/bw_fast_math_test.dart
  - test/lib/helpers/fast_atan2_test.dart
  - test/lib/helpers/gain_test.dart
  - test/lib/widgets/basic/controls/control_mouse_handler_pointer_lock_web_test.dart
  - test/lib/visualization/ring_buffer_test.dart
  - codegen/test/writer_test.dart

# Discover the remaining Flutter unit/widget tests under these directories.
# This pass follows the same JavaScript/WebAssembly compiler selection.
flutter:
  - test/lib
  - codegen/test

# These suites require desktop files, host build tools, or a built asset bundle.
# Native IPC, native engine integration, and repository checks are outside the
# Flutter roots above and continue to run in the existing desktop CI job.
exclude:
  - test/lib/helpers/logging/anthem_logging_test.dart
  - test/lib/logic/project_file_codec_test.dart
  - test/lib/logic/main_window_file_test.dart
  - test/lib/widgets/main_window/render_dialog_controller_test.dart
  # Flutter's browser test server does not build the AssetManifest used here.
  # The native suite checks every bundled SVG with the same decoder.
  - test/lib/widgets/basic/icon_test.dart
  - codegen/test/dependency_tracking_integration_test.dart
