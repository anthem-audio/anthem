name: Desktop integration smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  startup:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: ./.github/actions/shared-init
      - name: Install virtual display
        if: runner.os == 'Linux'
        run: sudo apt install -y xvfb
      - name: Startup and note editing (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1280x800x24" dart run anthem:cli integration-test --seed 42 --output build/integration_test/ci
      - name: Startup and note editing (macOS)
        if: runner.os == 'macOS'
        run: dart run anthem:cli integration-test --seed 42 --output build/integration_test/ci
      - name: Upload logs and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-startup-${{ runner.os }}
          path: build/integration_test/ci
          if-no-files-found: warn
