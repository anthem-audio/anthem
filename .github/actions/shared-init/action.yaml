name: Initialize project
description: Install build tools, check out the code, and run code generation
runs:
  using: composite
  steps:
    - name: Install build tools (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt update
        sudo apt install -y ca-certificates gnupg lsb-release software-properties-common wget
        wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
        source /etc/os-release
        llvm_codename="${UBUNTU_CODENAME:-$VERSION_CODENAME}"
        sudo add-apt-repository -y "deb https://apt.llvm.org/${llvm_codename}/ llvm-toolchain-${llvm_codename}-22 main"
        sudo apt update
        sudo apt install -y \
          ninja-build llvm-22 clang-22 clang-format-22 clang-tidy-22 libx11-dev libxi-dev \
          libxrandr-dev libxinerama-dev libxcursor-dev libfreetype-dev mesa-common-dev \
          libasound2-dev freeglut3-dev libxcomposite-dev libgtk-3-dev libasound2-dev \
          libwebkit2gtk-4.1-dev libcurl4-openssl-dev
        echo "ANTHEM_LLVM_BIN=/usr/lib/llvm-22/bin" >> "$GITHUB_ENV"
        echo "/usr/lib/llvm-22/bin" >> "$GITHUB_PATH"

    - name: Install build tools (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install llvm@22 ninja
        echo "ANTHEM_LLVM_BIN=$(brew --prefix llvm@22)/bin" >> $GITHUB_ENV
        echo "$(brew --prefix llvm@22)/bin" >> $GITHUB_PATH

    - name: Install build tools (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $llvmVersion = '22.1.8'
        $llvmArch = if ($env:RUNNER_ARCH -eq 'ARM64') { 'woa64' } else { 'win64' }
        $llvmSha256 = if ($env:RUNNER_ARCH -eq 'ARM64') {
          '76f44ef1ba6eeb5a65904e9500f042f588fade49952778ce48f0374daa934396'
        } else {
          '16e5709785fef73c854646241c4a92c5cd574318d1b33c63330dd7721903e55c'
        }
        $llvmInstaller = Join-Path $env:RUNNER_TEMP "LLVM-$llvmVersion-$llvmArch.exe"
        $llvmDirectory = Join-Path $env:RUNNER_TEMP "llvm-$llvmVersion"
        Invoke-WebRequest "https://github.com/llvm/llvm-project/releases/download/llvmorg-$llvmVersion/LLVM-$llvmVersion-$llvmArch.exe" -OutFile $llvmInstaller
        if ((Get-FileHash $llvmInstaller -Algorithm SHA256).Hash -ne $llvmSha256) {
          throw 'LLVM installer checksum does not match the pinned release.'
        }
        $installation = Start-Process $llvmInstaller -ArgumentList "/S /D=$llvmDirectory" -Wait -PassThru
        if ($installation.ExitCode -ne 0) {
          throw "LLVM installation failed with exit code $($installation.ExitCode)."
        }
        $llvmBin = Join-Path $llvmDirectory 'bin'
        foreach ($tool in @('clang', 'clang-format', 'clang-tidy')) {
          $versionOutput = & (Join-Path $llvmBin "$tool.exe") --version
          if ($LASTEXITCODE -ne 0 -or ($versionOutput -join [Environment]::NewLine) -notmatch [regex]::Escape($llvmVersion)) {
            throw "$tool does not report the pinned LLVM version $llvmVersion."
          }
        }
        choco install ninja -y
        if ($LASTEXITCODE -ne 0) {
          throw "Ninja installation failed with exit code $LASTEXITCODE."
        }
        Add-Content $env:GITHUB_ENV "ANTHEM_LLVM_BIN=$llvmBin"
        Add-Content $env:GITHUB_PATH $llvmBin
        Add-Content $env:GITHUB_PATH 'C:\ProgramData\chocolatey\bin'

    - name: Print LLVM tool versions
      shell: bash
      run: |
        clang --version
        clang-format --version
        clang-tidy --version

    - name: Clone Flutter
      shell: bash
      run: |
        git clone --depth 1 --branch 3.47.6 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
        echo "$RUNNER_TEMP/flutter/bin" >> $GITHUB_PATH

    - name: Install Flutter
      shell: bash
      run: flutter doctor

    - name: Get Dart dependencies
      shell: bash
      run: flutter pub get

    - name: Run code generation
      shell: bash
      run: dart run anthem:cli codegen generate --explicit-format-for-ci
