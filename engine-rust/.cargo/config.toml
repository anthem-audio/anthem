[target.wasm32-unknown-emscripten]
rustflags = [
    "-Ctarget-feature=+atomics",
    "-Cpanic=abort",
    "-Clink-arg=-pthread",
    # Preload the worker that runs Rust main.
    "-Clink-arg=-sPROXY_TO_PTHREAD=1",
    "-Clink-arg=-sPTHREAD_POOL_SIZE=1",
    "-Clink-arg=-sALLOW_BLOCKING_ON_MAIN_THREAD=0",
    "-Clink-arg=-sMODULARIZE=1",
    "-Clink-arg=-sEXPORT_NAME=AnthemRustEngine",
    "-Clink-arg=-sEXPORTED_FUNCTIONS=_main",
]
