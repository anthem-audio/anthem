[target.wasm32-unknown-emscripten]
rustflags = [
    "-Ctarget-feature=+atomics",
    "-Cpanic=abort",
    "-Clink-arg=-pthread",
    # Preload the worker that runs Rust main.
    "-Clink-arg=-sPROXY_TO_PTHREAD=1",
    "-Clink-arg=-sPTHREAD_POOL_SIZE=2",
    "-Clink-arg=-sALLOW_BLOCKING_ON_MAIN_THREAD=0",
    "-Clink-arg=-sMODULARIZE=1",
    "-Clink-arg=-sEXPORT_NAME=AnthemEngine",
    "-Clink-arg=-sEXPORTED_RUNTIME_METHODS=PThread,HEAPU8,HEAPU32,HEAP32",
    "-Clink-arg=-sEXPORTED_FUNCTIONS=_main,_isCommsReady,_hasEngineExited,_getEngineExitCode,_requestEngineShutdown,_getReadBufferHeadPtr,_getReadBufferTailPtr,_getReadBufferCapacity,_getReadBufferMask,_getReadBufferDataPtr,_getReadBufferTicketPtr,_getWriteBufferHeadPtr,_getWriteBufferTailPtr,_getWriteBufferCapacity,_getWriteBufferMask,_getWriteBufferDataPtr,_getWriteBufferTicketPtr",
]
